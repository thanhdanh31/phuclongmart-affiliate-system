
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phúc Long Mart - Affiliate</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sidebar">
        <h2>PHÚC LONG MART</h2>
        <p>Affiliate System</p>

        <button onclick="showPage('dashboard')">Dashboard</button>
        <button onclick="showPage('affiliate')">Quản lý Affiliate</button>
        <button onclick="showPage('orders')">Quản lý đơn hàng</button>
        <button onclick="showPage('commission')">Hoa hồng</button>
        <button onclick="showPage('reconcile')">Đối soát</button>
        <button onclick="showPage('payment')">Thanh toán</button>
    </div>

    <main>
        <header>
            <h1>Hệ thống quản lý Affiliate</h1>
            <p>Chào mừng đến với Phúc Long Mart</p>
        </header>

        <section id="content">
            <h2>Tổng quan hệ thống</h2>
            <div class="cards">
                <div class="card">
                    <h3>Affiliate</h3>
                    <p>128</p>
                </div>
                <div class="card">
                    <h3>Đơn hàng</h3>
                    <p>1.245</p>
                </div>
                <div class="card">
                    <h3>Hoa hồng</h3>
                    <p>35.800.000 VNĐ</p>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
